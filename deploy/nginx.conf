# =============================================================================
# ZOLEX — nginx site configuration
#
# Serves the built SPA and proxies /api to the API container.
#
# TLS: the commented 443 block at the end is complete and ready. Enable it once
# certificates exist, and switch the port-80 server to a redirect.
# =============================================================================

# Defence in depth. The API rate-limits too; this stops a flood before it ever
# reaches Node. The login bucket is deliberately far tighter than the API one.
limit_req_zone $binary_remote_addr zone=zolex_api:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=zolex_login:10m rate=10r/m;

upstream zolex_api {
    server api:4000;
    keepalive 32;
}

map $sent_http_content_type $zolex_cache {
    default                    "no-store";
    ~image/                    "public, max-age=2592000, immutable";
    ~font/                     "public, max-age=2592000, immutable";
    application/javascript     "public, max-age=31536000, immutable";
    text/css                   "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ── Once TLS is enabled, replace the body below with: ──
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }
    # location / { return 301 https://$host$request_uri; }

    root /usr/share/nginx/html;
    index index.html;

    # An ERP page is not a public web page; do not let it be framed or sniffed.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Google Fonts is the only external origin the UI uses.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    server_tokens off;
    client_max_body_size 25m;      # import files

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=zolex_api burst=40 nodelay;

        proxy_pass         http://zolex_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Long enough for a large Excel import; short enough to fail visibly.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Exports stream; buffering them wastes memory and delays first byte.
        proxy_buffering off;
    }

    # Sign-in is the endpoint worth attacking. Tighter bucket, no burst.
    location = /api/v1/auth/login {
        limit_req zone=zolex_login burst=5 nodelay;

        proxy_pass         http://zolex_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # bcrypt is intentionally slow; do not time out a legitimate sign-in.
        proxy_read_timeout 60s;
    }

    # ── Static assets ────────────────────────────────────────────────────────
    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── SPA ──────────────────────────────────────────────────────────────────
    # index.html must never be cached, or users keep a stale bundle after deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Never serve dotfiles.
    location ~ /\. { deny all; }
}

