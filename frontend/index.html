<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ZOLEX Purchase-to-Store Enterprise ERP — Zeeta Electrical Engineering Pvt. Ltd." />
    <meta name="theme-color" content="#0b0f2a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>ZOLEX — Purchase-to-Store Enterprise ERP</title>
    <script>
      /* Applies the saved theme before first paint so the app never flashes the
         wrong palette. Mirrors src/lib/theme.tsx; kept inline and dependency-free
         because it must run before the bundle loads. */
      (function () {
        try {
          var saved = localStorage.getItem('zolex.theme');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {
          /* Private mode or blocked storage: fall back to the OS preference. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
