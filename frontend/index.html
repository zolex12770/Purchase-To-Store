<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ZOLEX Purchase-to-Store Enterprise ERP — Zeeta Electrical Engineering Pvt. Ltd." />
    <meta name="theme-color" content="#f4f1ec" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- No web-font link: Inter is bundled (@fontsource-variable/inter, imported
         in src/main.tsx) and served by the ERP itself, so the office LAN needs no
         internet and first paint no longer waits on fonts.googleapis.com. -->
    <title>ZOLEX — Purchase-to-Store Enterprise ERP</title>
    <script>
      /* Applies the saved theme before first paint so the app never flashes the
         wrong palette. Mirrors src/lib/theme.tsx; kept inline and dependency-free
         because it must run before the bundle loads. */
      (function () {
        try {
          var saved = localStorage.getItem('zolex.theme');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {
          /* Private mode or blocked storage: fall back to the OS preference. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
